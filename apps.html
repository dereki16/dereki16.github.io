<body class="page-apps">

  <nav class="tabbar">

      <a href="index.html" class="tabbar-home" aria-label="Home">D</a>

  <section class="hero" style="padding-bottom: 60px;">
    <div class="wrap">

  <footer>

  <script src="js/apps.js"></script>
  <script src="js/contact.js"></script>
  <script>
    document.addEventListener('fullscreenchange', () => {
      document.querySelectorAll('video.is-fullscreen').forEach(v => v.classList.remove('is-fullscreen'));
      const el = document.fullscreenElement;
      if (el && el.tagName === 'VIDEO') el.classList.add('is-fullscreen');
    });

    const menuBtn = document.getElementById('menuBtn');
    const tabbarTabs = document.getElementById('tabbarTabs');
    menuBtn.addEventListener('click', () => tabbarTabs.classList.toggle('is-open'));
  </script>
