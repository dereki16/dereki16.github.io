<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Message sent — thanks for reaching out to Derek Iniguez.">
  <meta name="robots" content="noindex">
  <title>Thanks — Derek Iniguez</title>
  <link rel="icon" href="webp/site-icon.webp">
  <link href="style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="js/theme.js"></script>
  <script src="js/contact.js"></script>
</head>
<body class="page-thanks">

  <nav class="tabbar">
    <div class="tabbar-inner">
      <a href="index.html" class="tabbar-home" aria-label="Home">D</a>
      <div class="tabbar-tabs" id="tabbarTabs">
        <a class="tab" href="index.html">← home.js</a>
      </div>
      <a class="tab-resume" href="https://docs.google.com/document/d/1vY541cLzyQ2TkQ35L3Il_cmxH7qhyhgY/view" target="_blank" rel="noreferrer">Resume ↗</a>
      <button class="tabbar-menu-btn" id="menuBtn" aria-label="Toggle navigation menu">☰</button>
    </div>
  </nav>

  <section class="hero thanks-hero">
    <div class="wrap thanks-wrap">
      <p class="eyebrow">message sent</p>
      <h1 class="thanks-title">Thanks for reaching out<span class="accent">.</span></h1>
      <p class="hero-sub">Your message is on its way to my inbox — I read every one and usually reply within a couple of days. In the meantime, feel free to look around more of my work.</p>

      <div class="hero-actions">
        <a class="btn btn-primary" href="index.html">Back to home</a>
        <a class="btn btn-ghost" href="index.html#websites">See my work</a>
      </div>

      <p class="thanks-redirect mono" id="thanksRedirect"></p>
    </div>
  </section>

  <footer>
    <div class="wrap footer-row">
      <div class="footer-social">
        <a href="mailto:derekini.dev@gmail.com" aria-label="Email me"><i class="fa fa-envelope-o"></i></a>
        <a href="https://github.com/dereki16" target="_blank" rel="noreferrer" aria-label="GitHub"><i class="fa fa-github"></i></a>
        <a href="https://www.linkedin.com/in/derek-iniguez/" target="_blank" rel="noreferrer" aria-label="LinkedIn"><i class="fa fa-linkedin"></i></a>
      </div>
      <p class="footer-meta mono">designed &amp; developed by Derek Iniguez © 2026</p>
    </div>
  </footer>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const tabbarTabs = document.getElementById('tabbarTabs');
    menuBtn.addEventListener('click', () => tabbarTabs.classList.toggle('is-open'));

    // Gentle auto-redirect home, cancellable by just clicking anything
    // else on the page (any click/keypress/touch stops it).
    const redirectEl = document.getElementById('thanksRedirect');
    let secondsLeft = 12;
    let cancelled = false;

    function tick() {
      if (cancelled) return;
      if (secondsLeft <= 0) {
        window.location.href = 'index.html';
        return;
      }
      redirectEl.textContent = `// heading back home in ${secondsLeft}s…`;
      secondsLeft -= 1;
      setTimeout(tick, 1000);
    }
    tick();

    ['click', 'keydown', 'touchstart', 'wheel'].forEach(evt => {
      window.addEventListener(evt, () => {
        if (cancelled) return;
        cancelled = true;
        redirectEl.textContent = '';
      }, { once: true, passive: true });
    });
  </script>
</body>
</html>
